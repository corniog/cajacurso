<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin conexión</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f6f8f7;color:#1d2a27;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  .box{max-width:360px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{color:#5d6b67;margin:0 0 20px}
  button{background:#1f6f5c;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con el servidor. Revisa tu internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
